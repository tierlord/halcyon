[package]
name = "halcyon-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
futures = "0.3.34"
hickory-resolver = "0.26.3"
keyring = "4.2.0"
mail-parser = "1.0.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "http2", "query"] }
roxmltree = "0.21.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
